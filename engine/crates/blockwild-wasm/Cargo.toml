[package]
name = "blockwild-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blockwild-types.workspace = true
blockwild-protocol.workspace = true
blockwild-engine.workspace = true
blockwild-render = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }

[features]
default = []
renderer = ["dep:blockwild-render", "dep:wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true
